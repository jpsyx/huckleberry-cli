name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: python3 -B -m unittest discover -s scripts/release/tests -v
      # Waiting outside the publish lock prevents an older run being trapped
      # behind the very run waiting for it to finish.
      - name: Wait for earlier main pushes
        run: python3 -B -m scripts.release wait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: main-releases
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Publish version, tag, and GitHub release
        run: python3 -B -m scripts.release publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
