# Typical ranges, by age.
#
# What is in here is guidance a pediatrician gives a parent, not a clinical
# threshold and not a target. Every band was adversarially reviewed against
# primary sources on 2026-09-30; the record is in `docs/research/`, and the
# method for doing it again is in `docs/research/methodology.md`.
#
# Four rules govern every line of it:
#
#   1. There is NO band for milk volume, at any age, and there must never be
#      one. The figure people reach for is 150 to 200 ml per kilogram per day.
#      It does get published: Royal Children's Hospital Melbourne gives exactly
#      that range for well children 0 to 3 months, ESPGHAN gives 135 to 200 for
#      preterm infants, and the AAP's own term figure of 2 1/2 oz per pound
#      sits inside it at 163 ml/kg/day. So the reason this band stays out is
#      not that nobody publishes it. The reason is what it would do.
#
#      Measured intake in healthy exclusively breastfed term infants runs 135
#      ml/kg/day at one month, 126 at three months and 107 at six
#      (Rios-Leyvraz & Yao, Breastfeeding Medicine 2023;18(3):188, a
#      meta-analysis of 167 studies). A chart drawing a floor of 150 would tell
#      the parent of a thriving breastfed baby that they were underfeeding,
#      every day, for most of the first year.
#
#      The sources also disagree at the one age where intake per kilogram peaks
#      and the band would matter most: around one month it is variously 135,
#      150 and 154 ml/kg/day depending on the study. By rule 4 below that
#      disagreement is itself a reason not to draw the line.
#
#      And the number depends on something this tool cannot know. How much a
#      baby needs differs between breast milk and formula, and a logged bottle
#      may hold either. So the band is absent by construction rather than by a
#      special case somebody could delete, and a test asserts that no metric
#      here mentions volume.
#
#   2. Labels say what kind of claim they are making, and what they are about.
#      "typical" describes what was observed in a population; "recommended"
#      reports what a body advises. The two are not the same and are not
#      honestly said in each other's words: the sleep bands from four months on
#      are recommendations, and observed normal is wider than all of them.
#
#      Then comes the subject: "typical SLEEP at this age", "typical FEED in
#      the first weeks", "typical DIAPERS from day 3". These are printed in a
#      column with no header, one under another, so a label that does not say
#      what it is about is a label the reader has to decode.
#
#   3. Labels are declarative, never imperative. No "should", no "call your
#      doctor". The parent decides what to do; this says what is typical. The
#      one pointer to a pediatrician lives in the code, applies to the whole
#      table rather than to any reading, and is the only exception.
#
#   4. A floor sits UNDER every qualifying source, and a ceiling sits OVER
#      every one. Where sources disagree the floor goes beneath the lowest of
#      them and the top above the highest. A band that tells somebody they are
#      short when a reputable body says they are fine is the failure this file
#      exists to avoid, and the mirror matters as much: the first pass at
#      correcting this file left an 18-hour newborn sleep ceiling that flagged
#      about one healthy newborn in nine as sleeping too much.
#
#      Two limits on this rule, both learned by getting them wrong:
#
#      A vague or aggregated source does not override a specific day-by-day one
#      from an equally qualified body. "In the first few days" loses to a chart
#      with a row per day.
#
#      Where the sources describe two populations that genuinely differ, taking
#      the lowest floor silently adopts the population whose low reading is
#      least dangerous. That is not caution, it is under-warning, and the
#      answer is to publish no band at all. The stool count past the first days
#      is exactly this case, which is why it is not here.
#
# Counts have no ceilings. No qualifying source names a high number of feeds or
# diapers as atypical, and several say the opposite, so every count band here
# is a floor. Sleep is the one metric with a top, because it is the one metric
# a body puts a top on.
#
# `max_age_days` is the last age in days a band applies to, and the bands of a
# metric are read in order, so the first one whose age is not yet passed wins.
# Running off the end means there is no band, which is the honest answer
# wherever the pattern stops being typical enough to name. That happens a lot
# in this file and it is deliberate every time.
#
# AGES ARE DAYS SINCE BIRTH, so age 0 is the first day of life. Clinical
# guidance counts the other way, from 1. Labels are written in days of life,
# because that is how a midwife says it out loud, so a label reading "day 5"
# belongs to the band whose ages reach 4. Check this every time you touch a
# newborn band: it is the easiest mistake in the file to make.
#
# `high` left out means "or more": a floor with no ceiling. A test checks that
# every band without one says so in its label, so leaving it out by accident
# cannot quietly turn a range into a floor.
#
# `source` says where a range came from, so a future reader can check it rather
# than trust it.

# ---------------------------------------------------------------------------

[[metrics]]
metric = "sleep_per_day"
unit = "seconds"

  # Under four months there is no recommendation to report. The AASM refuses
  # to make one: "Recommendations for infants younger than 4 months are not
  # included due to the wide range of normal variation in duration and patterns
  # of sleep, and insufficient evidence for associations with health outcomes."
  #
  # The NSF does recommend 14 to 17 hours, but that is a recommendation, the
  # NSF is not a paediatric body, and observed sleep is far wider. Galland's
  # meta-analysis of diary and questionnaire data, which is the same kind of
  # record this tool keeps, gives a mean of 14.6 hours at 0 to 2 months with
  # limits of 9.3 and 20.0. A floor of 14 would call about 41% of a healthy
  # newborn population short, and a ceiling of 17 would call 19% of them long.
  #
  # So the band is observed rather than recommended, and it takes each end from
  # whichever qualifying source is furthest out: the floor from the NHS, the
  # ceiling from Galland.
  [[metrics.bands]]
  max_age_days = 121
  low = 28800.0    # 8 hours
  high = 72000.0   # 20 hours
  label = "typical sleep at this age: 8 to 20 hours in 24"
  source = "NHS Best Start in Life, your baby's sleep patterns (8 to 18 hours, either perfectly normal); Galland et al., Sleep Med Rev 2012;16(3):213, table 2, 0-2 months (9.3 to 20.0)"

  # From four months the AASM does make a recommendation, so these say
  # "recommended" rather than "typical": they report what a body advises, not
  # what was observed, and observed normal is wider than all of them. Every
  # figure is per 24 hours including naps, which is what this tool totals.
  #
  # The NSF gives 12 to 15 for this band where the AASM gives 12 to 16. The
  # AASM is used throughout: it is newer, paediatric rather than lifespan, and
  # the AAP formally endorsed it.
  #
  # Known limitation: because these are recommendations rather than observed
  # ranges, a healthy baby can sit under one. Galland's observed lower limit at
  # six months is near 9 hours, so the weekly summary will call some normal
  # babies "under that". Reporting a recommendation honestly is the best this
  # can do until a paediatric body publishes observed ranges by age.
  [[metrics.bands]]
  max_age_days = 364
  low = 43200.0    # 12 hours
  high = 57600.0   # 16 hours
  label = "recommended sleep at this age: 12 to 16 hours in 24"
  source = "AASM consensus, endorsed by the AAP (4 to 12 months): Paruthi et al., J Clin Sleep Med 2016;12(6):785"

  [[metrics.bands]]
  max_age_days = 1094
  low = 39600.0    # 11 hours
  high = 50400.0   # 14 hours
  label = "recommended sleep at this age: 11 to 14 hours in 24"
  source = "AASM consensus, endorsed by the AAP (1 to 2 years, stated in the methods paper as 1 to <3 years)"

  # Stops the day before the sixth birthday, where the AASM's next band begins
  # at 9 to 12 hours. The tool stops there; the evidence does not.
  [[metrics.bands]]
  max_age_days = 2189
  low = 36000.0    # 10 hours
  high = 46800.0   # 13 hours
  label = "recommended sleep at this age: 10 to 13 hours in 24"
  source = "AASM consensus, endorsed by the AAP (3 to 5 years, stated in the methods paper as 3 to <6 years)"

# ---------------------------------------------------------------------------

[[metrics]]
metric = "feeds_per_day"
unit = "count"

  # One logged feed is one session: a nursing on either or both breasts, or a
  # bottle. That is Kent's "meal" rather than her per-breast count, and the
  # difference is large enough to matter, so it is written down here.
  #
  # None of these bands has a ceiling. No qualifying source names a high number
  # of feeds as atypical, and the CDC says the opposite: "Some babies may feed
  # as often as every hour at times, often called cluster feeding."
  [[metrics.bands]]
  max_age_days = 28
  low = 8.0
  label = "typical feed in the first weeks: 8 or more feeds a day"
  source = "CDC: about 8 to 12 times in 24 hours; AAP: 10-12 sessions is the norm breastfed, 8 the minimum bottle-fed"

  # The floor drops here, and it drops on purpose. Kent's observed mean for
  # exclusively breastfed infants aged 1 to 6 months is 7.9 sessions a day
  # (range 4 to 13), so a floor of 8 would call about half of a normal
  # population short.
  #
  # There is no separate 4-to-6-month band because Kent 2013 found frequency
  # falling between 1 and 3 months and then "constant between 3 and 6 months".
  # The decline this file used to assert past 4 months is the part that does
  # not happen; the earlier one does, and this band's floor sits under both
  # ends of it. Formula-fed babies feed less often, around 6 to 8 a day, which
  # sits inside this floor rather than under it.
  [[metrics.bands]]
  max_age_days = 180
  low = 4.0
  label = "typical feed at this age: 4 or more feeds a day"
  source = "Kent et al., Pediatrics 2006;117(3):e387 (7.9 meals a day, range 4-13) and Breastfeeding Medicine 2013 (steady 3 to 6 months), both funded by Medela AG, a breast pump manufacturer"

  # Past six months there is no band, because the two feeding modes stop
  # agreeing and this tool cannot tell them apart. The CDC's breastfeeding page
  # declines to give a number at all ("Continue to follow your baby's cues"),
  # while its formula page gives "about 5 to 6 times in 24 hours" and the AAP's
  # "4 or 5 feedings" is a formula figure stated at exactly 6 months. On top of
  # that, solids make a milk-feed count measure less and less of what the baby
  # actually ate. Past a year the guidance stops being a feed count at all and
  # becomes a volume of cow's milk, which this tool does not track.

# ---------------------------------------------------------------------------

[[metrics]]
metric = "wet_per_day"
unit = "count"

  # Ages are days since birth, so age 0 is the first day of life and age 2 is
  # the third. The labels are written in days of life, because that is how a
  # midwife says it out loud.
  #
  # Every band is a floor. Newborns void about twenty times a day in the first
  # month, so a high count is never the thing worth flagging.
  #
  # The AAP says "In the first few days after birth, a baby should have 2 to 3
  # wet diapers each day", which conflicts sharply with the CDC's chart from
  # day 3 on. The CDC wins here under the first limit on rule 4: it gives a row
  # per day where the AAP gives one phrase for an unspecified span, and
  # under-warning on a dehydrating newborn is the worse way to be wrong.
  [[metrics.bands]]
  max_age_days = 0
  low = 1.0
  label = "typical diapers on day 1: 1 or more wet diapers"
  source = "CDC newborn breastfeeding chart, day 1 minimum 1; AAP newborn visit, a minimum of 1 wet and soiled on day 1"

  [[metrics.bands]]
  max_age_days = 1
  low = 2.0
  label = "typical diapers on day 2: 2 or more wet diapers"
  source = "CDC newborn breastfeeding chart, day 2 minimum 2; AAP newborn visit, a minimum of 2 wet and soiled on day 2"

  # The CDC gives 5 on day 3 and 6 from day 4. The floor stays at 5 rather than
  # climbing to 6, because the AAP and the ABM both put the settled figure at
  # "at least 5 to 6" and rule 4 takes the lower. Formula-fed babies take more
  # volume earlier than breastfed ones, so a chart drawn from breastfed babies
  # is if anything conservative for them.
  [[metrics.bands]]
  max_age_days = 180
  low = 5.0
  label = "typical diapers from day 3: 5 or more wet diapers a day"
  source = "CDC newborn breastfeeding chart, day 3 minimum 5; AAP, after the first 4 to 5 days at least 5 to 6 a day; ABM Clinical Protocol #2 (2014 revision), at least five to six urinations by Day 5"

  # Past six months there is no band. Every figure that exists for an older
  # baby is a dehydration threshold rather than a typical count, and the bodies
  # disagree about it (the Canadian Paediatric Society uses fewer than 4, the
  # AAP and Cleveland Clinic fewer than 6). The floor this file used to carry
  # here, 4, sat below the AAP's own alarm value, so it called a reading
  # typical on a day the AAP says to telephone.

# ---------------------------------------------------------------------------

[[metrics]]
metric = "dirty_per_day"
unit = "count"

  # Ages are days since birth, so age 0 is the first day of life.
  #
  # This metric used to run a floor of 3 from day 4 through six weeks. That was
  # the worst number in the file: three soiled diapers on day 4 is the value
  # the literature uses to FLAG possible inadequate intake (ABM Clinical
  # Protocol #3, on Nommsen-Rivers 2008), so the band reassured a parent with
  # precisely the reading a clinician would act on.
  #
  # The first correction replaced it with a floor of 1 running to three weeks,
  # justified by the AAP's formula-fed minimum of one a day. That was worse.
  # The AAP puts a BREASTFED baby at "at least 3 to 4 of these per day" by 5 to
  # 7 days, and the CDC names "fewer than 3 poops ... per day by 5 days old" as
  # a warning sign. A floor of 1 painted that baby green for seventeen days,
  # and low stool output in a breastfed newborn is the classic sign of
  # inadequate milk transfer.
  #
  # Both failures have the same cause. Breastfed and formula-fed babies differ
  # about threefold here (Moretti 2019: 4.9 a day against 2.3 in the first
  # month), and this tool cannot tell them apart, because a logged bottle may
  # hold expressed milk and many babies are fed both ways. A floor of 3 would
  # flag most normal formula-fed days; a floor of 1 misses the breastfed baby
  # who needs flagging. There is no honest single number, so past the meconium
  # days there is no band. The real fix is a feeding-method setting the parent
  # sets deliberately, and it is not built.
  [[metrics.bands]]
  max_age_days = 1
  low = 1.0
  label = "typical diapers in the first 2 days: 1 or more dirty diapers a day"
  source = "AAP: 1 or 2 bowel movements per day on days 1 and 2, blackish and tarry; UNICEF UK: day 1-2, 1 or more"

  [[metrics.bands]]
  max_age_days = 3
  low = 2.0
  label = "typical diapers on days 3 and 4: 2 or more dirty diapers a day"
  source = "AAP: at least two stools on days 3 and 4, turning greenish to yellow; UNICEF UK: day 3-4, 2 preferably more"
