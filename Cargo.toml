# The workspace. Two packages that know as little about each other as
# possible: a reusable Huckleberry client library, and the command-line tool
# that happens to be its first consumer.
[workspace]
members = ["crates/huckleberry-api"]
# So that a bare `cargo test` or `cargo clippy` at the root covers both
# packages rather than only the binary.
default-members = [".", "crates/huckleberry-api"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# The library half of this repository, consumed by path. Publishing it is a
# version number away: nothing in it mentions the CLI.
huckleberry-api = { path = "crates/huckleberry-api", version = "0.5.0" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"

[package]
name = "huckleberry-cli"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A terminal client and dashboard for Huckleberry baby tracking."

# The library half holds everything worth testing; the binary is a thin shell
# around it. Its name is fixed (the package name is not a valid identifier when
# it is hyphenated), so tests and the binary both say `use app::...`.
[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "huckleberry-cli"
path = "src/main.rs"

[dependencies]
# Error context a human can read: every failure carries the `.context(...)` of
# what the tool was trying to do.
anyhow = "1"
# The command-line surface. `derive` keeps the flags next to the types they
# fill; `env` lets any flag also come from the environment.
clap = { version = "4", features = ["derive", "env"] }
# Reading a password without echoing it, and the terminal backend the
# dashboard draws on. Already in the tree under ratatui; named here because
# `prompt` uses it directly.
crossterm = "0.29"
# The Huckleberry client. The CLI holds no knowledge of Firestore.
huckleberry-api = { workspace = true }
# Day boundaries in the family's timezone, DST included. A "day" in this tool
# is a local calendar day, and 23- and 25-hour days have to come out right.
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }
# Full-screen dashboards: the stripe chart, the sparklines, the tables.
ratatui = "0.30"
# The configuration struct is (de)serialized rather than parsed by hand, so a
# new setting is one more field. `derive` is the whole reason it is here.
serde = { workspace = true }
# The snapshot file `export` writes and `--offline` reads, and the untyped
# shape the normalizer tolerates.
serde_json = { workspace = true }
# The async runtime the client needs. `rt-multi-thread` because a snapshot
# pulls several collections at once.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# The configuration file format: a config a person edits by hand should look
# like one. `preserve_order` keeps a table in the order it was read instead of
# sorting it, so rewriting the file does not reshuffle what the user wrote.
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Help and about strings would render literal backticks in a terminal.
doc_markdown = "allow"
# A tool binary, not a published library surface: the error and panic sections
# would be ceremony no reader asked for. `huckleberry-api` opts back in.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Unix timestamps travel as `f64` because that is how Huckleberry stores them,
# and seconds since 1970 are exact in an `f64` for the next eight million
# years. The conversions to and from the integer types are deliberate.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
# Every `f64 -> usize` here is a fraction already clamped to 0..=1 or a count
# already known to be positive, on its way to a column width or a cell index.
cast_sign_loss = "allow"
# `LiveState` and `DiaperEvent` have four booleans because the trackers record
# four independent facts. Bundling them into an enum would lose a combination
# the app can and does write.
struct_excessive_bools = "allow"
# Adding `Eq` to a type that mirrors a Huckleberry document is a promise that
# no future field of it will be a float, which is a promise about somebody
# else's schema.
derive_partial_eq_without_eq = "allow"
# `3.0 * 3600.0 - x` reads as three hours and `3.0f64.mul_add(-3600.0, x)`
# does not. The precision this trades away is invisible at the scale of
# seconds in a day.
suboptimal_flops = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
